"$schema": http://json-schema.org/draft-07/schema#
title: ISO/TC 12 Liaisons
type: object
properties:
  external_organisations:
    type: array
    items:
      type: object
      required: [id, short_name]
      properties:
        id: { type: string }
        short_name: { type: string }
        name: { type: string }
        category: { type: string }
        representatives: { type: array, items: { type: string } }
  iso_iec_committees:
    type: array
    items:
      type: object
      required: [ref]
      properties:
        ref: { type: string }
        representatives: { type: array, items: { type: string } }
