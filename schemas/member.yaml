"$schema": http://json-schema.org/draft-07/schema#
"$id": https://isotc12.github.io/schemas/member.yaml
title: ISO/TC 12 Member
type: object
additionalProperties: false
required:
  - member-id
  - name
  - active
  - roles
properties:
  member-id:
    type: string
    pattern: '^[a-z0-9-]+$'
  name:
    type: string
  salutation:
    type: string
  active:
    type: boolean
  roles:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          enum: [chair, committee_manager, secretariat_support, tpm, member, liaison_representative]
        nsbody:
          type: string
        member_type:
          type: string
          enum: [P-member, O-member]
        organization:
          type: string
        committee:
          type: string
        liaison_type:
          type: string
          enum: [A-liaison, B-liaison, C-liaison, D-liaison]
