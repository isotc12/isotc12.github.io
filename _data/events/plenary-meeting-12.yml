    event: Plenary meeting (Gaithersburg)
    description: |
      12th plenary meeting of ISO/TC 12, held at NIST Gaithersburg, MD, USA.
      Thirteen resolutions (P-2015-01 through P-2015-13) covering agenda
      adoption, business plan, ISO 80000 series restructuring (introductions
      consolidation, indices), DIS ballots for parts 2/5/7/10/12,
      development track change (36m→48m), JWG 20 status concerns and
      executive committee formation, liaison officer nominations, future
      work with IEC/TC 25 on logarithmic quantities, and next meeting
      planning (Berlin 2016).

