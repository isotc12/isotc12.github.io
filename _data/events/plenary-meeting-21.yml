schedule:
  - date: 2024-05-16
    time: "10:00–16:00 CEST"
    event: Plenary meeting (hybrid)
    description: |
      21st plenary meeting of ISO/TC 12, held in Stockholm (SIS office) with
      remote participation via Zoom. Agenda covered committee reports,
      business plan v.11, JWG 2 (joint with IEC/TC 25), JCGM/GUM/VIM work,
      liaison reports, ISO 80000 series amendments (including addition of
      SI Brochure as normative reference, retention of Annex B on rounding),
      relationship with IEC 80000-16, and next meeting scheduling. Nine
      resolutions (P-2024-01 through P-2024-09) adopted unanimously; see N1524.

