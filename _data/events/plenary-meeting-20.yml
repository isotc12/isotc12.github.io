schedule:
  - date: 2023-05-25
    event: Plenary meeting (hybrid)
    description: |
      20th plenary meeting of ISO/TC 12, held at SIS Stockholm with remote
      participation via Zoom. Agenda covered adoption, drafting committee,
      business plan v.11, disbandment of WG 21 (general) following
      publication of ISO 80000-1:2022, JCGM/WG 1 (GUM) appointment of
      Dr Carlsson, discontinuation of three liaisons (ISO/TC 8/SC 6,
      ISO/TC 47, ISO/TC 115), appointment of six liaison representatives,
      ISO 80000-3 systematic review and SI Brochure normative-reference
      amendment, and next meeting scheduling. Ten resolutions
      (P-2023-01 through P-2023-10) adopted unanimously; see N1499.

