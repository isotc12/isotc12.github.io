    description: |
      9th plenary meeting of ISO/TC 12, held in Prague, Czech Republic.
      Twelve consolidated resolutions (P-2010-01 through P-2010-12)
      covering agenda, business plan, Unicode annexes, OID codes for
      quantity concepts (later voided), special relativity additions
      for ISO 80000-3/-4, title changes for ISO 80000-2 and -8,
      ISO 80000-9 Annex B (metastable isotopes), ISO/IEC 80003 series
      title and identifiers, multiple liaison establishments (ISO/TC 215,
      ISO/TC 8/SC 6, IEC/TC 1, ICAO, ILO, WCO, OASIS QUOMOS), and
      future-work NWIPs.

