schedule:
  - date: 2017-10-20
    event: Plenary meeting (Berlin)
    description: |
      14th plenary meeting of ISO/TC 12, held in Berlin, Germany.
      Agenda covered business plan, IEC/TC 25 Joint Working Group
      creation (IEC lead, mode 5), EURAMET A-liaison establishment,
      CIPM letter on "unit of measurement" definition, ISO 80000
      series alignment with meter convention decisions, 9-month
      extension request for FDIS ballot timing, and next meeting
      scheduling. Ten resolutions (P-2017-01 through P-2017-10).

