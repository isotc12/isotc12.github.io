schedule:
  - date: 2016-08-25
    event: Plenary meeting (Stockholm)
    description: |
      13th plenary meeting of ISO/TC 12, held in Stockholm, Sweden.
      Agenda covered business plan, JWG 20 disbandment, liaison
      approaches (IEC/TC 25 reciprocal, EURAMET, ITU Vocabulary, ITU-T
      SG 17), ISO 80000 series status (DIS/FDIS ballots for parts 1,
      3, 5, 7, 8, 12), project leader appointments (Knopf for 80000-3,
      Ainslie for 80000-8), reappointment of WG 19 convenor Krystek,
      and next meeting (Berlin 2017). Twenty-two resolutions
      (P-2016-01 through P-2016-22), all unanimous.

