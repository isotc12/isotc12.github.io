schedule:
  - date: 2026-05-26
    time: "12:00–15:07 CEST"
    event: Plenary meeting
    description: |
      23rd plenary meeting of ISO/TC 12, held virtually via Zoom.
      Agenda covered committee manager's report, strategic business plan,
      JWG 2 (joint with IEC/TC 25) report, JCGM/GUM/VIM liaison reports,
      working-group and liaison reports, systematic reviews of ISO 80000-4
      and ISO 80000-8, ISO/IEC Directives update, and any other business.
      Nine resolutions (P-2026-02 through P-2026-10) were adopted unanimously.

