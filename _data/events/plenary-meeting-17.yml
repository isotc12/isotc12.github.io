schedule:
  - date: 2020-05-28
    event: Plenary meeting (Zoom)
    description: |
      17th plenary meeting of ISO/TC 12, held virtually via Zoom (originally
      planned as an in-person meeting in St. Petersburg; converted to
      virtual due to the COVID-19 pandemic). Agenda covered business plan
      update, WG 21 (General) report with five CIBs on ISO 80000-1
      rewrites (definitions → VIM reference, SI text → SI Brochure,
      Annex A → CODATA, printing rules, third CD preparation), and
      establishment of two task forces (TF 1 on ISO 80000 revision needs,
      and a Directives Part 2 task force). Ten resolutions
      (P-2020-01 through P-2020-10) adopted unanimously.

