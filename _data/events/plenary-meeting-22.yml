schedule:
  - date: 2025-05-22
    time: "13:00–16:00 CEST"
    event: Plenary meeting
    description: |
      22nd plenary meeting of ISO/TC 12, held virtually via Zoom.
      Agenda covered secretariat report, strategic business plan (SBP v.12),
      JWG 2 (joint with IEC/TC 25) report, JCGM/GUM/VIM liaison, CalConnect
      introduction (UnitsML), systematic reviews of ISO 80000 parts, and
      revision of ISO 80000-2:2019. Six resolutions (P-2025-02 through
      P-2025-07) were adopted unanimously under Acting Chair Prof Grimvall.

