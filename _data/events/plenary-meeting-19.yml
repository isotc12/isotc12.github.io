    event: Plenary meeting (Zoom)
    description: |
      19th plenary meeting of ISO/TC 12, held virtually via Zoom.
      Agenda covered chairing (Prof Grimvall appointed), drafting
      committee, business plan v.10, WG 21 status update, JWG 2 report,
      liaison reports, future role in machine-readable quantities and
      units (Dr Knopf tasked), and next meeting in Stockholm. Six
      resolutions (P-2022-01 through P-2022-06) adopted unanimously.

