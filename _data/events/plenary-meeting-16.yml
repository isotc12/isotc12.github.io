schedule:
  - date: 2018-10-08
    event: Plenary meeting (Helsinki)
    description: |
      16th plenary meeting of ISO/TC 12, held in Helsinki, Finland.
      Agenda covered business plan update, ISO 80000-1 revision
      (cancel ongoing revision; initiate new revision under Vienna
      Agreement with Mr Pendrill as project leader), disbandment of
      WG 19, ITU-T SG 17 liaison on Biology-to-machine protocol,
      data representation for quantities and units, and next meeting
      scheduling. Eight resolutions (P-2018-01 through P-2018-08)
      adopted; six unanimously, two (P-2018-03 and P-2018-04 on
      ISO 80000-1 revision) by majority with one abstention (Germany).

