schedule:
  - date: 2021-05-26
    event: Plenary meeting (Zoom)
    description: |
      18th plenary meeting of ISO/TC 12, held virtually via Zoom.
      Agenda covered secretariat report, business plan v.9, disbandment
      of TF 1 (ISO 80000-series revision study), call for nominations
      for WG 21 convenor, and eight TF1 recommendations on individual
      parts of ISO 80000. Twelve resolutions (P-2021-01 through
      P-2021-12) adopted; eleven unanimously, one (P-2021-07 on
      ISO 80000-3 confirmation) by majority vote with one abstention.

